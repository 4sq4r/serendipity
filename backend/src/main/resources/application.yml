spring:
  application:
    name: serendipity
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/serendipity}
    username: ${DB_USERNAME:serendipity}
    password: ${DB_PASSWORD:serendipity}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
